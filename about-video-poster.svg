<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" role="img" aria-label="Meet VB.dev intro video placeholder">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#13233d"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="44%" r="55%">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <style>
    .icon {
      transform-box: view-box;
      transform-origin: 0 0;
      transform: translate(50%, 42%);
    }
    .title {
      fill: #f8fafc;
      font-family: 'SFMono-Regular',Consolas,'Courier New',monospace;
      font-size: 24px;
      font-weight: 700;
      letter-spacing: 2px;
    }
    .caption {
      fill: #94a3b8;
      font-family: 'SFMono-Regular',Consolas,'Courier New',monospace;
      font-size: 10px;
      letter-spacing: 2px;
    }
    @media (min-width: 400px) {
      .title { font-size: 32px; }
      .caption { font-size: 12px; letter-spacing: 3px; }
    }
    @media (min-width: 700px) {
      .title { font-size: 40px; }
      .caption { font-size: 14px; letter-spacing: 4px; }
    }
  </style>

  <rect width="100%" height="100%" fill="url(#bg)"/>
  <rect width="100%" height="100%" fill="url(#glow)"/>

  <g stroke="#38bdf8" stroke-opacity="0.1" stroke-width="1">
    <line x1="0" y1="16.6667%" x2="100%" y2="16.6667%"/>
    <line x1="0" y1="33.3333%" x2="100%" y2="33.3333%"/>
    <line x1="0" y1="50%" x2="100%" y2="50%"/>
    <line x1="0" y1="66.6667%" x2="100%" y2="66.6667%"/>
    <line x1="0" y1="83.3333%" x2="100%" y2="83.3333%"/>
    <line x1="9.375%" y1="0" x2="9.375%" y2="100%"/>
    <line x1="18.75%" y1="0" x2="18.75%" y2="100%"/>
    <line x1="28.125%" y1="0" x2="28.125%" y2="100%"/>
    <line x1="37.5%" y1="0" x2="37.5%" y2="100%"/>
    <line x1="46.875%" y1="0" x2="46.875%" y2="100%"/>
    <line x1="56.25%" y1="0" x2="56.25%" y2="100%"/>
    <line x1="65.625%" y1="0" x2="65.625%" y2="100%"/>
    <line x1="75%" y1="0" x2="75%" y2="100%"/>
    <line x1="84.375%" y1="0" x2="84.375%" y2="100%"/>
    <line x1="93.75%" y1="0" x2="93.75%" y2="100%"/>
  </g>

  <g class="icon">
    <circle r="42" fill="rgba(56,189,248,0.08)" stroke="#38bdf8" stroke-width="3"/>
    <circle r="25" fill="none" stroke="#38bdf8" stroke-width="2.5"/>
    <path d="M-8 -12 L14 0 L-8 12 Z" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linejoin="round"/>
  </g>

  <text x="50%" y="68%" text-anchor="middle" class="title">Meet VB.dev</text>
  <text x="50%" y="76%" text-anchor="middle" class="caption">INTRO VIDEO COMING SOON</text>
</svg>
